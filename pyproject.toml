[build-system]
requires = ["setuptools>=80", "wheel", "packaging>=24.2", "cmake>=3.24", "pybind11>=2.12"]
build-backend = "setuptools.build_meta"

[project]
name = "moira-astro"
version = "6.3.0"
description = "Ephemeris and astrology engine with native C++ core, built on JPL DE441 and SPK kernels."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Moira contributors" },
]
keywords = [
    "astronomy",
    "astrology",
    "ephemeris",
    "jpl",
    "spk",
    "sidereal",
    "houses",
    "transits",
    "swiss-ephemeris",
    "horoscope",
    "natal-chart",
    "python-astrology",
    "celestial-mechanics",
    "jpl-de441",
    "astrometry",
    "ephemeris-engine",
    "reproducible-science",
    "astrology-api",
    "planetary-positions",
    "IAU-2006",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.10"
dependencies = []

[project.urls]
Homepage = "https://github.com/TheDaniel166/moira"
Repository = "https://github.com/TheDaniel166/moira"
Issues = "https://github.com/TheDaniel166/moira/issues"

[project.optional-dependencies]
lunar-graze = [
    "spiceypy>=8.0",
    "laspy[lazrs]>=2.7",
    "requests>=2.31",
]
server = [
    "fastapi>=0.115,<0.137",
    "starlette>=0.46,<1.3",
    "uvicorn>=0.30",
    "pydantic>=2.8",
]
dev = [
    "build>=1.2",
    "cmake>=3.24",
    "pybind11>=2.12",
    "twine>=6.0",
    "pytest>=9.0",
    "pytest-cov>=6.0",
    "pytest-xdist>=3.5",
    "ruff==0.16.0",
    "pyyaml>=6.0",
    "hypothesis>=6.100",
    "httpx>=0.27,<0.29",
    "pyerfa>=2.0",
    "astropy>=6.0",
]

[project.scripts]
moira-download-kernels = "moira.download_kernels:main"
moira-kernel-manager   = "moira.kernel_manager_ui:main"
moira-daf-writer       = "moira.daf_writer_ui:main"

[tool.setuptools]
include-package-data = false
packages = ["moira", "moira.data", "moira.compat", "moira.compat.nasa", "moira.constellations", "moira.primary_directions", "moira.harmograms", "moira.bridges", "moira.kernels", "moira.sky", "moira_server", "moira_server.models", "moira_server.routers", "moira_server.serializers", "moira_server.services"]

[tool.setuptools.package-data]
moira = [
    "data/*.txt",
    "data/*.csv",
    "data/*.json",
    "kernels/**/*.json",
    "kernels/asteroids_wheel/*.json",
    "kernels/asteroids_wheel/*.bsp",
    "kernels/asteroids_wheel/SHA256SUMS",
    "kernels/asteroids_wheel/LICENSE",
    "kernels/asteroids_wheel/NOTICE.md",
]

[tool.pytest.ini_options]
testpaths    = ["tests"]
pythonpath   = [".", "tests"] # repo-local code and test utilities only
addopts      = "-ra -q --import-mode=importlib"
norecursedirs = [".git", ".venv", ".hypothesis", ".pytest_cache", "__pycache__", "dist", "tmp"]
markers = [
    "unit:            fast, isolated unit tests",
    "integration:     tests that exercise multiple modules or use de441.bsp",
    "loopback:        tests permitted to use numeric loopback or AF_UNIX local IPC only",
    "external_network: external access; requires --run-external-network in an isolated external-only process",
    "network:         forbidden legacy marker; collection fails until reclassified",
    "slow:            tests that take more than ~5 seconds",
    "requires_ephemeris: typed planetary-kernel capability; the plain form requires content-derived DE441, generic=True is identity-independent, and optional keyword fields constrain product, identity, interval, bodies, target/center routes, frame, segment types, and native support",
    "property:        property-based tests (Hypothesis)",
    "lola:            tests for the LOLA lunar-topography substrate",
    "numpy_free_lunar_limb: tests for the native/stdlib lunar-limb path",
    "template:        template/boilerplate tests (opt-in via MOIRA_RUN_TEMPLATES=1)",
    "experimental:    experimental tests (opt-in via MOIRA_RUN_EXPERIMENTAL=1)",
    "parallel:        safe to run in parallel with pytest-xdist",
    "serial:          must run serially (global state / file locks)",
    "ui:              tests that require a Qt application instance (PySide6)",
]

[tool.ruff]
target-version = "py310"
extend-exclude = [
    "scratch",
    "scripts/archive",
    "tmp",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"moira/classical.py" = ["F401"]
"moira/facade.py" = ["F401"]
"moira/harmograms/__init__.py" = ["F401"]
"moira/predictive.py" = ["F401"]
"moira/vedic.py" = ["F401"]
"moira_server/models/__init__.py" = ["F401"]
"moira_server/services/__init__.py" = ["F401"]
