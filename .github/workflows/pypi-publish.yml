name: PyPI Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  validate-release:
    name: Validate release identity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Match tag, package, changelog, and release documents
        run: python scripts/check_release_identity.py --tag "$GITHUB_REF_NAME"

  release-hardening:
    needs: validate-release
    uses: ./.github/workflows/release-hardening.yml

  release-acceptance:
    needs: validate-release
    uses: ./.github/workflows/release-acceptance.yml

  build-wheels:
    name: Build wheels on ${{ matrix.os }}
    needs: [validate-release, release-hardening, release-acceptance]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-26-intel, macos-26]

    steps:
      - uses: actions/checkout@v4

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.1.0
        env:
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-* cp314-*"
          CIBW_SKIP: "*-musllinux_*"
          CIBW_ARCHS_LINUX: x86_64
          CIBW_ARCHS_WINDOWS: AMD64
          CIBW_BEFORE_BUILD: pip install cmake pybind11
          CIBW_BUILD_VERBOSITY: 1
          CIBW_DEPENDENCY_VERSIONS: latest

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  build-sdist:
    name: Build source distribution
    needs: [validate-release, release-hardening, release-acceptance]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: pip install build

      - name: Build sdist
        run: python -m build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  website-publication:
    name: Generate exact-tag website publication evidence
    needs: validate-release
    runs-on: ubuntu-latest
    env:
      MOIRA_NO_DOWNLOAD: "1"
      MOIRA_TEST_MODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install the tagged engine
        run: python -m pip install -e .

      - name: Generate and validate exact-tag publication
        run: |
          python scripts/build_website_docs_bundle.py --release-tag "$GITHUB_REF_NAME" --output "$RUNNER_TEMP/website-publication/publication.json"
          python scripts/build_website_docs_bundle.py --release-tag "$GITHUB_REF_NAME" --output "$RUNNER_TEMP/website-publication/publication.json" --check

      - uses: actions/upload-artifact@v4
        with:
          name: website-publication-release-${{ github.ref_name }}
          path: ${{ runner.temp }}/website-publication/publication.json
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: [release-hardening, release-acceptance, build-wheels, build-sdist, website-publication]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          verbose: true
          skip-existing: true
