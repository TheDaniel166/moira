name: Release Hardening

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  docstring-preflight:
    name: Engine Docstring Preflight
    runs-on: ubuntu-latest

    env:
      MOIRA_NO_DOWNLOAD: "1"
      MOIRA_TEST_MODE: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Check all engine docstrings before native builds
        run: python tests/unit/test_docstring_governance.py

  generated-artifacts:
    # Stable branch-protection context; keep this name unique across workflows.
    name: Generated Artifact Gate
    needs: docstring-preflight
    runs-on: ubuntu-latest

    env:
      MOIRA_NO_DOWNLOAD: "1"
      MOIRA_TEST_MODE: "1"
      MOIRA_STRICT_KNOWN_ISSUES: "1"

    steps:
      - name: Checkout repository and published wiki
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install package and maintenance test dependencies
        run: python -m pip install -e ".[dev,server]"

      - name: Check existing docstring preflight wiring
        run: python -m pytest tests/unit/test_docstring_governance.py -k "test_checker or test_preflight" -q

      - name: Check generated artifacts without rewriting them
        run: python scripts/maintain_generated.py --check

      - name: Run maintenance and synchronization regression tests
        run: |
          python -m pytest \
            tests/unit/test_lightbox_generated_maintenance.py \
            tests/unit/test_lightbox_fingerprints.py \
            tests/unit/test_git_wiki_sync.py \
            tests/unit/test_hellenistic_inventory_generation.py \
            -q

  python-310-server-compatibility:
    name: Python 3.10 Server Compatibility Gate
    needs: docstring-preflight
    runs-on: ubuntu-latest

    env:
      MOIRA_NO_DOWNLOAD: "1"
      MOIRA_TEST_MODE: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up minimum supported Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install optional server
        run: python -m pip install -e ".[server]"

      - name: Smoke Python 3.10 server contracts
        run: |
          python - <<'PY'
          from pydantic import ValidationError

          from moira_server import create_app
          from moira_server.models.asteroids import AsteroidSubsetSlug
          from moira_server.models.electional import ElectionalPredicateProfileId
          from moira_server.models.lord_of_the_orb import LordOfTheOrbCycleKindRequest
          from moira_server.models.lord_of_the_turn import LordOfTheTurnMethodRequest
          from moira_server.models.manazil import MansionComputationMode
          from moira_server.models.nodes import NodeComputationMethod
          from moira_server.models.timelords import DecennialNatalRequest
          from moira_server.models.kalachakra import KalachakraSequenceRequest

          for profile_id in ("bphs_santhanam_longitude_row_cycle_v1", "rao_2000_longitude_continuous_v1"):
              kalachakra = KalachakraSequenceRequest.model_validate({
                  "profile_id": profile_id,
                  "seed": {"basis": "sidereal", "moon_sidereal_lon": 45.8},
                  "levels": 2,
              })
              assert kalachakra.levels == 2
          try:
              KalachakraSequenceRequest.model_validate({
                  "profile_id": "bphs_santhanam_longitude_row_cycle_v1",
                  "seed": {"basis": "sidereal", "moon_sidereal_lon": 45.8},
                  "levels": True,
              })
          except ValidationError:
              pass
          else:
              raise AssertionError("Kalachakra depth must reject booleans")

          enum_types = (
              AsteroidSubsetSlug,
              ElectionalPredicateProfileId,
              LordOfTheOrbCycleKindRequest,
              LordOfTheTurnMethodRequest,
              MansionComputationMode,
              NodeComputationMethod,
          )
          assert all(issubclass(enum_type, str) for enum_type in enum_types)
          assert all(list(enum_type) for enum_type in enum_types)

          accepted = DecennialNatalRequest.model_validate(
              {
                  "dt": "2000-01-01T12:00:00Z",
                  "is_day_chart": True,
                  "deep_subdivision_method": None,
              }
          )
          assert accepted.deep_subdivision_method is None
          try:
              DecennialNatalRequest.model_validate(
                  {
                      "dt": "2000-01-01T12:00:00Z",
                      "is_day_chart": True,
                      "deep_subdivision_method": "valens",
                  }
              )
          except ValidationError:
              pass
          else:
              raise AssertionError("named Decennial deep methods must remain rejected")

          schemas = create_app().openapi()["components"]["schemas"]
          request_schema = schemas["DecennialNatalRequest"]
          deep_method = request_schema["properties"]["deep_subdivision_method"]
          assert deep_method["type"] == "null"
          assert deep_method["deprecated"] is True
          assert "deep_subdivision_method" not in request_schema["required"]
          assert "DecennialDeepSubdivisionMethod" not in schemas
          PY

  release-hardening:
    name: Release Hardening Gate
    needs: [docstring-preflight, generated-artifacts]
    runs-on: ubuntu-latest

    env:
      MOIRA_NO_DOWNLOAD: "1"
      MOIRA_TEST_MODE: "1"
      MOIRA_STRICT_KNOWN_ISSUES: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Moira's authoritative runtime is the project .venv on Python 3.14.
          # Release hardening must validate against the same port baseline.
          python-version: "3.14"

      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev,server]"

      - name: Run docstring checker self-tests without repeating the corpus scan
        run: python -m pytest tests/unit/test_docstring_governance.py -k "test_checker or test_preflight" -q

      - name: Check release-facing doc consistency
        run: python scripts/check_doc_consistency.py

      - name: Check release identity
        run: python scripts/check_release_identity.py

      - name: Run Light Box conformance governance regression tests
        run: python -m pytest tests/unit/test_lightbox_*.py -q

      - name: Generate and validate current-source website publication candidate
        run: |
          python scripts/build_website_docs_bundle.py --candidate --output "$RUNNER_TEMP/website-publication/publication.json"
          python scripts/build_website_docs_bundle.py --candidate --output "$RUNNER_TEMP/website-publication/publication.json" --check

      - name: Retain website publication candidate
        uses: actions/upload-artifact@v4
        with:
          name: website-publication-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/website-publication/publication.json
          if-no-files-found: error

      - name: Run source-defined Kalachakra engine and REST gates
        run: |
          python -m pytest \
            tests/unit/test_kalachakra_sources.py \
            tests/unit/test_kalachakra.py \
            tests/unit/test_kalachakra_admission.py \
            tests/unit/test_kalachakra_projection.py \
            tests/unit/test_kalachakra_astronomy.py \
            tests/unit/test_kalachakra_public_api.py \
            tests/unit/test_kalachakra_rao_sources.py \
            tests/unit/test_kalachakra_rao.py \
            tests/unit/test_kalachakra_compatibility.py \
            tests/server/test_server_kalachakra.py \
            tests/server/test_server_kalachakra_openapi.py \
            tests/server/test_server_kalachakra_rao.py \
            -q -m "not requires_ephemeris"

      - name: Run source-defined yoga engine and REST gates
        run: |
          python -m pytest \
            tests/unit/test_yoga_extensions.py \
            tests/unit/test_yoga_extension_admission.py \
            tests/unit/test_yogas.py \
            tests/unit/test_varga_exact_partition.py \
            tests/server/test_server_yoga_extensions.py \
            tests/server/test_vedic_direct_input_hardening.py \
            -q

      - name: Run Hellenistic release gates
        run: |
          python -m pytest \
            tests/unit/test_hellenistic_source_goldens.py \
            tests/unit/test_hellenistic_inventory_generation.py \
            tests/unit/test_hellenistic_contract_parity.py \
            tests/unit/test_hellenistic_profile.py \
            tests/unit/test_profections.py \
            tests/unit/test_timelords_public_api.py \
            tests/unit/test_dignities_public_api.py \
            tests/unit/test_lots_public_api.py \
            tests/unit/test_triplicity.py \
            tests/unit/test_egyptian_bounds.py \
            tests/unit/test_egyptian_bounds_public_api.py \
            tests/unit/test_decanates.py \
            tests/unit/test_hermetic_decans.py \
            tests/server/test_hellenistic_contract_openapi.py \
            tests/server/test_server_hellenistic_profile.py \
            tests/server/test_server_hellenistic_aspects_routes.py \
            tests/server/test_server_dignities_routes.py \
            tests/server/test_server_lots_routes.py \
            tests/server/test_server_triplicity_routes.py \
            tests/server/test_server_egyptian_bounds_routes.py \
            tests/server/test_server_decans_routes.py \
            tests/server/test_server_timelord_routes.py \
            tests/server/test_server_phase8_timelord_routes.py \
            tests/server/test_server_phase8_decennial_routes.py \
            -q
          python -m pytest tests/server/test_server_route_discoverability.py -q

      - name: Run public surface and release hardening suites
        run: |
          python -m pytest tests/unit/test_website_docs_bundle_generation.py -q
          python -m pytest tests/unit/test_public_api_drift.py tests/unit/test_public_api_contract.py -q
          python -m pytest tests/unit/test_public_doctrine_surfaces.py -q
          python -m pytest tests/unit/test_dasha.py -q
          python -m pytest tests/unit/test_dasha_systems.py tests/unit/test_dasha_full_intervals.py tests/unit/test_varga_exact_partition.py tests/unit/test_shadbala_source_repairs.py tests/unit/test_vedic_reader_scan_repairs.py -q
          python -m pytest tests/unit/test_vedic_second_pass_repairs.py tests/server/test_server_vedic_second_pass_repairs.py -q
          python -m pytest tests/unit/test_timelords.py -q
          python -m pytest tests/unit/test_cycles.py -q
          python -m pytest tests/unit/test_muhurta_lagna.py tests/server/test_server_muhurta_lagna.py -q
          python -m pytest tests/unit/test_muhurta_marriage.py tests/unit/test_muhurta_marriage_visibility.py tests/unit/test_muhurta_marriage_enclosure.py tests/unit/test_muhurta_marriage_windows.py tests/server/test_server_muhurta_marriage.py -q -m "not requires_ephemeris"

      - name: Planet-first stellium and selected-zodiac house contracts
        run: |
          python -m pytest \
            tests/unit/test_stelliums.py \
            tests/unit/test_stelliums_public_api.py \
            tests/unit/test_house_sidereal_frame.py \
            tests/server/test_server_stelliums.py \
            -m "not external_network" -q

      - name: Run 6.1 contract and catalog gates
        run: |
          python -m pytest \
            tests/unit/test_aspects.py \
            tests/unit/test_patterns.py \
            tests/unit/test_api_surface_adversarial_audit.py \
            tests/unit/test_asteroid_identity_catalog.py \
            tests/unit/test_comet_identity_catalog.py \
            tests/unit/test_comets.py \
            tests/unit/test_small_body_catalog_builder_manifests.py \
            tests/unit/test_asteroid_type13_apsidal_audit.py \
            tests/unit/test_small_body_catalog_release.py \
            tests/unit/test_small_body_release_loader_gate.py \
            tests/unit/test_small_body_identity_resolution.py \
            tests/unit/test_small_body_packaged_manifest_receipts.py \
            tests/unit/test_planet_position_switches.py \
            tests/unit/test_moira_progressions.py \
            tests/unit/test_void_of_course.py \
            tests/server/test_server_small_body_list_routes.py \
            tests/server/test_server_chart_routes.py \
            tests/server/test_server_astrocartography_routes.py \
            tests/server/test_server_aspects_from_longitudes.py \
            tests/server/test_server_patterns_policy.py \
            -q

      - name: Reject unused imports and undefined names in source
        run: ruff check moira moira_server scripts --select F401,F821,F822,F823 --no-fix
